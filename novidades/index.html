<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novidades do Clip</title>
  <meta name="description" content="Changelog das regras do Sistema Clip e da ficha digital.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/clip.css">
  <style>
    article { max-width: 760px; margin: 0 auto; padding: 8px 16px 80px; }
    article h1 { font-size: 2.2rem; }
    article h2 { margin-top: 2em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    article h3 { margin: 1.6em 0 0.4em; color: var(--accent); }
    article :is(h2, h3) { scroll-margin-top: 72px; }
    article li { margin: 4px 0; }
    article code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    .ancora-link { opacity: 0; margin-left: 6px; text-decoration: none; font-size: 0.8em; }
    :is(h2, h3):hover .ancora-link { opacity: 1; }
    :target, .destaque { background: var(--mark); border-radius: 6px; }
    .estado { color: var(--ink-2); padding: 40px 0; }
  </style>
</head>
<body>
  <header class="topo">
    <a class="marca" href="../">Clip</a>
    <nav>
      <a href="../manual/">Manual</a>
      <a href="../ficha/">Ficha digital</a>
      <a href="../arena/">Arena</a>
      <a href="../cartas/">Cartas</a>
      <a href="./" aria-current="page">Novidades</a>
    </nav>
  </header>
  <article id="conteudo"><p class="estado">Carregando…</p></article>
  <footer id="rodape" class="rodape"></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script type="module">
    import { renderizar, irParaHash } from '../assets/markdown.js';
    const conteudo = document.getElementById('conteudo');
    try {
      await renderizar('CHANGELOG.md', conteudo);
      irParaHash();
    } catch {
      conteudo.innerHTML = '<p class="estado">Não foi possível carregar. <a href="https://github.com/marcelobritonet/clip-rpg/blob/master/CHANGELOG.md">Veja no GitHub</a>.</p>';
    }
  </script>
  <script type="module" src="../assets/rodape.js"></script>
</body>
</html>
