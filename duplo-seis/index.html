<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14100c">
  <title>Duplo Seis · uma mesa de RPG para um</title>
  <meta name="description" data-t-content="pagina.descricao" content="Uma sessão de RPG de mesa para um jogador, em dez minutos, sobre o Sistema Clip. O Mestre narra, você decide, os dados rolam.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Duplo Seis">
  <meta property="og:description" data-t-content="pagina.lema" content="Uma mesa de RPG para um. O Mestre narra, você decide, os dados rolam.">
  <meta property="og:image" content="https://marcelobritonet.github.io/clip-rpg/duplo-seis/icones/icone-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="duplo-seis.css">
</head>
<body>
  <div id="luz" aria-hidden="true"></div>

  <main id="inicio" class="tela">
    <nav id="idiomas" class="idiomas" data-t-aria="pagina.idioma" aria-label="Idioma"></nav>
    <header class="capa">
      <div class="selo" aria-hidden="true"><span class="dado mini"></span><span class="dado mini"></span></div>
      <h1 data-t="pagina.marca">Duplo Seis</h1>
      <p class="lema" data-t="pagina.lema">Uma mesa de RPG para um. O Mestre narra, você decide, os dados rolam.</p>
    </header>
    <details class="caixa como">
      <summary data-t="inicio.como">Como se joga</summary>
      <ul>
        <li data-t="inicio.como1"></li>
        <li data-t="inicio.como2"></li>
        <li data-t="inicio.como3"></li>
        <li data-t="inicio.como4"></li>
        <li data-t="inicio.como5"></li>
      </ul>
    </details>
    <section id="retomar" class="caixa destaque" hidden></section>
    <section id="dia" class="caixa"></section>
    <section>
      <p class="rotulo" data-t="inicio.aAventura">A aventura</p>
      <div id="aventuras" class="aventuras" role="radiogroup" data-t-aria="inicio.aventura" aria-label="Aventura"></div>
      <div id="oficina-acoes" class="oficina-acoes"></div>
    </section>
    <section id="secao-passados">
      <p class="rotulo" data-t="inicio.antesDosDados">Antes dos dados, o passado. Quem é você?</p>
      <div id="passados" class="passados" role="radiogroup" data-t-aria="inicio.passado" aria-label="Passado do personagem"></div>
    </section>
    <section id="escolhido" class="escolhido" hidden></section>
    <footer class="rodape-inicio">
      <a href="../manual/" data-t="pagina.manual">Manual do Sistema Clip</a> · <span id="versao"></span>
    </footer>
  </main>

  <main id="mesa" class="tela" hidden>
    <header class="topo">
      <div class="topo-linha">
        <button id="abrir-ficha" class="botao-ficha" type="button" aria-haspopup="dialog"><span id="topo-nome"></span><small data-t="pagina.ficha">ficha</small></button>
        <div class="ato" id="topo-ato"></div>
        <button id="som" class="icone" type="button" data-t-aria="pagina.som" aria-label="Som" aria-pressed="true">♪</button>
      </div>
      <div class="medidas" id="medidas"></div>
    </header>
    <section id="palco" class="palco" aria-live="polite"></section>
  </main>

  <dialog id="ficha" class="ficha"></dialog>

  <script type="module" src="ui.js"></script>
</body>
</html>
